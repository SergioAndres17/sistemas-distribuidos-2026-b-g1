openapi: '3.0.3'
info:
  title: 'SynkroTech Workflow Service API'
  version: '2.1.1'
  description: >-
    Review candidate: replay, rejection/recovery and retry clarifications depend on HU-ARQ-28/#254 and are not an Accepted modification of ADR-007. This candidate may be circulated for review; it does not replace ADR-007 Decision 2. Merge and adopt the dependent normative guidance only after the relevant decision is reviewed and accepted (see REST Guidelines, Saga decision status). Observed implementation deviations remain tracked in TD-013/014/015/016.


    The sale-registration saga, exposed as a resource (ADR-007 Decision 2, registered in ADR-004 Decision 6). The frontend starts a sale here; the workflow orchestrates three steps (validate-customer, reserve-stock, register-sale) with persisted state after every step, idempotent retries and compensation.


    This is the only externally-facing path of synkro-workflow. The gateway routes `/api/v1/sagas/*` here (ADR-008). The internal calls to synkro-customers-api, synkro-products-api and synkro-sales-api use the workflow's service token and are not part of this contract.


    Stack: Java / Spring Boot (ADR-008).

servers:
  - url: 'http://synkro-workflow:8080/api/v1'
    description: 'Inside the platform network (not published)'

security:
  - bearerAuth: []

tags:
  - name: 'Sagas'
    description: >
      Sale-registration saga resource (ADR-007 Decision 2, ADR-004 Decision 6).
  - name: 'Health'
    description: 'Health check (cross-cutting.md §4)'

paths:

  # ─── Sagas ─────────────────────────────────────────────────────────────

  /sagas/register-sale:
    post:
      operationId: 'startRegisterSaleSaga'
      summary: 'Start a sale-registration saga'
      tags: [ 'Sagas' ]
      description: >-
        Starts the register-sale saga for an authenticated human ADMIN or SALESPERSON. Authentication and role authorization precede replay lookup. Input and the 8–128 character key are validated before any step.


        The body supplies customerId and 1–100 distinct products with positive int32 quantities; prices and caller identity never come from the frontend. UUID case is normalized and line order is canonicalized before equivalence comparison. The first valid request creates one saga and returns 201 with Location. Equivalent input from the same caller and key returns 200 with that same saga without new effects. A different validated input returns generic 400; a key owned by another caller returns generic 403. Neither rejection reveals the stored owner, input or saga ID, and neither mutates the existing saga or calls a participant. No 409 is introduced.


        The HTTP request waits only for its bounded response deadline; durable execution may continue and GET supplies the public state. An ambiguous participant result may leave RUNNING suspended with reserved stock pending evidence; it does not establish safe compensation. Private attempt/correlation/recovery fields are not part of this response. These decision-dependent semantics remain a review candidate under HU-ARQ-28; GET authorization is unchanged.
      parameters:
        - $ref: '_shared.yaml#/components/parameters/IdempotencyKey'
        - $ref: '_shared.yaml#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSagaRequest'
      responses:
        '200':
          description: >
            Idempotent replay — same saga returned, no step run again. Status may be RUNNING, COMPLETED, COMPENSATED or FAILED depending on where the saga is.
          headers:
            X-Correlation-Id:
              $ref: '_shared.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SagaResponse'
        '201':
          description: >
            Saga started. If all steps completed within the request timeout, status is COMPLETED and saleId is present. Otherwise status is RUNNING.
          headers:
            Location:
              $ref: '_shared.yaml#/components/headers/Location'
            X-Correlation-Id:
              $ref: '_shared.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SagaResponse'
        '400':
          description: 'Invalid request/key or conflicting validated input for the same caller''s key; no stored input/owner is disclosed.'
          headers:
            X-Correlation-Id:
              $ref: '_shared.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ReplayError'
                  - type: 'object'
                    properties:
                      error:
                        type: 'string'
                        enum:
                          - 'VALIDATION_ERROR'
              examples:
                rejected:
                  summary: 'Generic safe error; no stored request or owner'
                  value:
                    error: 'VALIDATION_ERROR'
                    message: 'Invalid request'
                    traceId: '4f1c2b7e-8a3d-4e21-9b6f-0c5d7a2e1f90'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'
        '403':
          description: 'Role forbidden or the supplied key belongs to a different caller; generic response without stored saga/owner/input.'
          headers:
            X-Correlation-Id:
              $ref: '_shared.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ReplayError'
                  - type: 'object'
                    properties:
                      error:
                        type: 'string'
                        enum:
                          - 'FORBIDDEN'
              examples:
                rejected:
                  summary: 'Generic safe error; no stored request or owner'
                  value:
                    error: 'FORBIDDEN'
                    message: 'Caller is not authorized for this operation'
                    traceId: '4f1c2b7e-8a3d-4e21-9b6f-0c5d7a2e1f90'
        '500':
          $ref: '_shared.yaml#/components/responses/InternalError'

  /sagas/{id}:
    get:
      operationId: 'getSaga'
      summary: 'Get a saga by ID'
      tags: [ 'Sagas' ]
      description: >-
        Returns the saga's current state. The portal polls this endpoint when the POST answered with RUNNING. The representation shows status, completedSteps, failedStep (when compensated or failed) and saleId (when completed). It never shows internal details (input, step_results, error_detail) — ADR-007 Decision 2 defines the visible fields explicitly. Allowed to ADMIN and SALESPERSON. ADR-007 Decision 2, ADR-004 Decision 6.


        Malformed UUID identifiers return 400. The POST key-owner rule does not add an owner restriction to GET. RUNNING can include internally suspended unresolved execution; the public representation adds no diagnostic state or recovery metadata.
      parameters:
        - $ref: '#/components/parameters/SagaId'
        - $ref: '_shared.yaml#/components/parameters/CorrelationId'
      responses:
        '200':
          description: 'Saga found'
          headers:
            X-Correlation-Id:
              $ref: '_shared.yaml#/components/headers/XCorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SagaResponse'
        '400':
          $ref: '_shared.yaml#/components/responses/BadRequest'
        '401':
          $ref: '_shared.yaml#/components/responses/Unauthorized'
        '403':
          $ref: '_shared.yaml#/components/responses/Forbidden'
        '404':
          $ref: '_shared.yaml#/components/responses/NotFound'
        '500':
          $ref: '_shared.yaml#/components/responses/InternalError'

  # ─── Health ────────────────────────────────────────────────────────────

  /health:
    get:
      operationId: 'healthCheck'
      summary: 'Health check'
      tags: [ 'Health' ]
      security: []
      description: >-
        Checks connectivity to workflow_schema in the shared instance (ADR-009). Public — no token required (cross-cutting.md §4).


        Effective URL: http://synkro-workflow:8080/health. The API server prefix does not apply to this path.
      responses:
        '200':
          description: 'Healthy'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: 'Healthy response shape'
                  value:
                    status: 'ok'
                    service: 'synkro-workflow'
                    timestamp: '2026-10-24T20:00:00Z'
                    dependencies:
                      database: 'ok'
        '503':
          description: 'Unhealthy — database connectivity lost'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                unhealthy:
                  summary: 'Unhealthy own-store response shape'
                  value:
                    status: 'degraded'
                    service: 'synkro-workflow'
                    timestamp: '2026-10-24T20:00:00Z'
                    dependencies:
                      database: 'down'
    servers:
      - url: 'http://synkro-workflow:8080'
        description: 'Unversioned service origin; this overrides the /api/v1 business server'

# ─── Components ────────────────────────────────────────────────────────

components:
  securitySchemes:
    bearerAuth:
      type: 'http'
      scheme: 'bearer'
      bearerFormat: 'JWT'
      description: >
        RS256 JWT validated locally by this service (ADR-006). The gateway only checks presence; this service verifies signature, exp, sub and role/permissions. The sub of the person's token becomes the saga's initiatedBy.

  parameters:
    SagaId:
      name: 'id'
      in: 'path'
      required: true
      schema:
        type: 'string'
        format: 'uuid'

  schemas:

    # ── Request ──────────────────────────────────────────────────────

    StartSagaRequest:
      type: 'object'
      required: [ 'customerId', 'lines' ]
      description: >
        Only what the frontend knows. The workflow resolves prices during step 2 (reserve-stock). createdBy is taken from the sub of the person's validated token, not from the body.
      properties:
        customerId:
          type: 'string'
          format: 'uuid'
          description: 'The customer to associate the sale with. Validated in step 1.'
        lines:
          type: 'array'
          minItems: 1
          maxItems: 100
          description: >
            Products and quantities. Prices are resolved by the saga. A request with more than 100 lines is rejected with 400 before any step runs.
          items:
            $ref: '#/components/schemas/SagaLineRequest'

    SagaLineRequest:
      type: 'object'
      required: [ 'productId', 'quantity' ]
      properties:
        productId:
          type: 'string'
          format: 'uuid'
        quantity:
          type: 'integer'
          minimum: 1
          maximum: 2147483647

    # ── Response ─────────────────────────────────────────────────────

    SagaResponse:
      type: 'object'
      required: [ 'sagaId', 'sagaType', 'status', 'completedSteps', 'createdAt', 'updatedAt' ]
      description: >-
        The fixed public saga projection: sagaId, sagaType, status, completedSteps, optional failedStep/saleId, createdAt and updatedAt. Never return input, initiatedBy, step_results, error_detail, execution, pendingStep, attempts or stored correlation metadata. OUTCOME_UNRESOLVED and LOCAL_FAILURE are internal diagnostics, not public status values.
      properties:
        sagaId:
          type: 'string'
          format: 'uuid'
        sagaType:
          type: 'string'
          enum: [ 'register-sale' ]
        status:
          type: 'string'
          enum: [ 'RUNNING', 'COMPLETED', 'COMPENSATED', 'FAILED' ]
          description: >-
            RUNNING: durable work remains, including privately suspended ambiguous outcomes requiring evidence before further action. COMPLETED: all steps succeeded and saleId is present. COMPENSATED: confirmed rejection followed by successful required compensation, or no reservation existed. FAILED: compensation could not be completed within its durable bound; a person must decide. This clarification remains subject to HU-ARQ-28 and does not add a status.
        completedSteps:
          type: 'array'
          items:
            type: 'string'
            enum: [ 'validate-customer', 'reserve-stock', 'register-sale' ]
          description: 'Steps completed so far, in order.'
        failedStep:
          type: 'string'
          enum: [ 'validate-customer', 'reserve-stock', 'register-sale' ]
          description: >
            Present when status is COMPENSATED or FAILED. The step whose business rejection or error caused the saga to stop.
        saleId:
          type: 'string'
          format: 'uuid'
          description: >
            Present only when status is COMPLETED. The sale registered in synkro-sales-api by step 3.
        createdAt:
          type: 'string'
          format: 'date-time'
        updatedAt:
          type: 'string'
          format: 'date-time'
      additionalProperties: false

    HealthResponse:
      type: 'object'
      required: [ 'status', 'service', 'timestamp' ]
      properties:
        status:
          type: 'string'
          enum: [ 'ok', 'degraded' ]
        service:
          type: 'string'
          example: 'synkro-workflow'
        timestamp:
          type: 'string'
          format: 'date-time'
        dependencies:
          type: 'object'
          properties:
            database:
              type: 'string'
              enum: [ 'ok', 'down' ]
    ReplayError:
      description: 'Review-draft replay envelope. Shared Error fields only; private owner, input and saga diagnostics are forbidden.'
      allOf:
        - $ref: '_shared.yaml#/components/schemas/Error'
        - type: 'object'
          properties:
            error:
              type: 'string'
            message:
              type: 'string'
            details:
              type: 'array'
              items:
                $ref: '_shared.yaml#/components/schemas/ErrorDetail'
            traceId:
              type: 'string'
          additionalProperties: false
x-decision-dependency:
  issue: 'https://github.com/code-corhuila/synkro-docs/issues/254'
  status: 'pending-review-and-acceptance'
  modifies: 'ADR-007 Decision 2'
  nextRecord: 'ADR-015'
  excludedProposal: 'No unpublished infrastructure proposal is adopted'
  guidance-status: 'review-draft-only; not adopted as replacement guidance'
