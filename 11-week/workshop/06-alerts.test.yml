# Run: promtool test rules 06-alerts.test.yml
rule_files: [06-alerts.yml]
evaluation_interval: 1m
tests:
  # One failed sale in a quiet hour must not page anybody.
  - interval: 1m
    input_series:
      - series: 'workflow_requests_total{outcome="success"}'
        values: '0+0.2x120'
      - series: 'workflow_requests_total{outcome="error"}'
        values: '0x60 1x60'
    alert_rule_test:
      - eval_time: 70m
        alertname: RegisterSaleAvailabilityFastBurn
        exp_alerts: []

  # CP9 drill: 30 requests per hour, from minute 60 one in four takes 3 s.
  - interval: 1m
    input_series:
      - series: 'workflow_requests_total{outcome="success"}'
        values: '0+0.5x100'
      - series: 'workflow_request_duration_seconds_count{outcome="success"}'
        values: '0+0.5x100'
      - series: 'workflow_request_duration_seconds_bucket{outcome="success",le="1.0"}'
        values: '0+0.5x60 30.375+0.375x39'
    alert_rule_test:
      - eval_time: 79m
        alertname: RegisterSaleLatencyFastBurn
        exp_alerts: []
      - eval_time: 80m
        alertname: RegisterSaleLatencyFastBurn
        exp_alerts:
          - exp_labels: {severity: page, team: synkro-tech, slo: register-sale-latency}
            exp_annotations:
              summary: "Register-sale requests over 1 s are spending the latency budget 14.4 times too fast"
              description: "Slow ratio in the last hour is 8.333%."
              runbook_url: "https://github.com/SergioAndres17/sistemas-distribuidos-2026-b-g1/blob/main/11-week/workshop/07-runbook.md#latency-variant"
      - eval_time: 80m
        alertname: RegisterSaleAvailabilityFastBurn
        exp_alerts: []
