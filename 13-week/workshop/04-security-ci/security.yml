# Security gates proposed for the synkro-products-api pipeline.
# In this fork it runs against 13-week/workshop/04-security-ci/products-authz.
name: security

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency audit (govulncheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 13-week/workshop/04-security-ci/products-authz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  authorization:
    name: Negative authorization test
    runs-on: ubuntu-latest
    needs: [secrets, dependencies]
    defaults:
      run:
        working-directory: 13-week/workshop/04-security-ci/products-authz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test -v -run TestPriceChangeRejectsForgedAndUnauthorizedTokens ./...
