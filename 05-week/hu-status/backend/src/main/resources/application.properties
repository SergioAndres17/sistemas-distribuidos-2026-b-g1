spring.application.name=mvp

# PostgreSQL running in the "my-database" container (5435 -> 5432)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5435/synkrotech_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}

# Single public schema for the whole MVP. Per-context schemas are reserved for
# the real microservices (ADR-001); this spike is one process, one schema.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=public

# Off on purpose: every endpoint fetches what it serialises, so a lazy mistake
# fails loudly here instead of quietly holding a connection open per request.
spring.jpa.open-in-view=false


server.port=8080
